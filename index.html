<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talento · Bolsa de egresados</title>
    <script>
      try {
        for (const nombre of ['tema', 'perfilVisual', 'tamanoTexto', 'contraste']) {
          const valor = localStorage.getItem(`tecno.${nombre}`)
          if (valor) document.documentElement.dataset[nombre] = valor
        }
      } catch {
        // Se conservan los valores por defecto si el navegador restringe el almacenamiento.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
